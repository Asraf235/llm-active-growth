<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-size="21" font-weight="600" fill="#222">LLM-reviewed Bayesian optimisation of the SiOxNy plasma step for AlN seed layers on SiO2</text>
  <text x="600" y="52" text-anchor="middle" font-size="12" fill="#555">main GP + EI proposes · three auxiliary GPs describe · the LLM reviews · you decide and grow</text>

  <!-- spreadsheet -->
  <rect x="30" y="200" width="215" height="250" rx="10" fill="#f4f6fa" stroke="#333" stroke-width="1.5"/>
  <text x="137" y="224" text-anchor="middle" font-weight="600">AlN Sputter Log.xlsx</text>
  <text x="137" y="242" text-anchor="middle" font-size="11" fill="#555">sheet "AlN Oxy" (process, by Run #)</text>
  <rect x="45" y="252" width="185" height="58" fill="#fff" stroke="#999"/>
  <text x="137" y="268" text-anchor="middle" font-size="11" font-weight="600">free (optimised)</text>
  <text x="137" y="283" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace">OxyT OxyBias OxyAr</text>
  <text x="137" y="297" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace">OxyN2 OxyP OxyTime</text>
  <rect x="45" y="316" width="185" height="40" fill="#f3f3f3" stroke="#999"/>
  <text x="137" y="331" text-anchor="middle" font-size="11" font-weight="600">context (seen, held fixed)</text>
  <text x="137" y="346" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace">GrowthT=13 WorkP=1.7 StageMax</text>
  <text x="137" y="372" text-anchor="middle" font-size="11" fill="#555">sheet "AlN Oxy SiO2 Data" (measurements)</text>
  <rect x="45" y="380" width="88" height="24" fill="#e8eefc" stroke="#1f4e9c"/>
  <text x="89" y="396" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#1f4e9c">XRD FWHM</text>
  <rect x="141" y="380" width="89" height="24" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="185" y="396" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#2e7d32">thick rough dens</text>
  <text x="137" y="424" text-anchor="middle" font-size="10" fill="#777">aln_bo/config.py · data.py</text>
  <text x="137" y="440" text-anchor="middle" font-size="10" fill="#777">join by Run #, clean, average repeats</text>

  <!-- engine box -->
  <rect x="280" y="90" width="620" height="470" rx="14" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="300" y="114" font-weight="600" font-size="15">GP engine  (aln_bo package, sklearn or BoTorch backend)</text>

  <!-- main lane -->
  <rect x="300" y="130" width="580" height="190" rx="10" fill="#f3f6fd" stroke="#1f4e9c" stroke-width="1.5"/>
  <text x="315" y="152" font-weight="600" fill="#1f4e9c">Main loop · crystallinity</text>
  <rect x="315" y="170" width="160" height="110" rx="8" fill="#fff" stroke="#1f4e9c" stroke-width="1.5"/>
  <text x="395" y="192" text-anchor="middle" font-weight="600" fill="#1f4e9c">main GP</text>
  <text x="395" y="210" text-anchor="middle" font-size="11">Matérn-5/2, ARD, noise</text>
  <text x="395" y="226" text-anchor="middle" font-size="11">(6 free + 3 context) → FWHM</text>
  <text x="395" y="246" text-anchor="middle" font-size="11" fill="#555">mean μ(x), std σ(x)</text>
  <text x="395" y="262" text-anchor="middle" font-size="11" fill="#555">lengthscales = which knobs matter</text>
  <rect x="505" y="170" width="160" height="110" rx="8" fill="#fff" stroke="#1f4e9c" stroke-width="1.5"/>
  <text x="585" y="192" text-anchor="middle" font-weight="600" fill="#1f4e9c">Expected Improvement</text>
  <text x="585" y="210" text-anchor="middle" font-size="11">incumbent = best GP mean</text>
  <text x="585" y="226" text-anchor="middle" font-size="11">at the fixed context</text>
  <text x="585" y="246" text-anchor="middle" font-size="11" fill="#555">Sobol pool → L-BFGS → snap</text>
  <text x="585" y="262" text-anchor="middle" font-size="11" fill="#555">irrelevant knobs pinned</text>
  <rect x="695" y="170" width="170" height="110" rx="8" fill="#e8eefc" stroke="#1f4e9c" stroke-width="1.5"/>
  <text x="780" y="192" text-anchor="middle" font-weight="600" fill="#1f4e9c">suggested sample</text>
  <text x="780" y="210" text-anchor="middle" font-size="11">recipe + FWHM ± σ + EI</text>
  <text x="780" y="226" text-anchor="middle" font-size="11">+ next-best alternatives</text>
  <text x="780" y="246" text-anchor="middle" font-size="11" fill="#555">maps: FWHM mean / std / EI</text>
  <text x="780" y="262" text-anchor="middle" font-size="11" fill="#555">suggestion.csv · alternatives.csv</text>
  <line x1="475" y1="225" x2="503" y2="225" stroke="#1f4e9c" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="665" y1="225" x2="693" y2="225" stroke="#1f4e9c" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="590" y="306" text-anchor="middle" font-size="10" fill="#777">campaign.MainCampaign · acquisition.suggest_ei / incumbent · plotting.pair_maps</text>

  <!-- aux lane -->
  <rect x="300" y="340" width="580" height="200" rx="10" fill="#f1f8f2" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="315" y="362" font-weight="600" fill="#2e7d32">Auxiliary surrogates · prediction only (no acquisition)</text>
  <rect x="315" y="380" width="165" height="70" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="397" y="402" text-anchor="middle" font-weight="600" fill="#2e7d32">GP · SiOxNy thickness</text>
  <text x="397" y="420" text-anchor="middle" font-size="11">XRR, nm (19 runs)</text>
  <rect x="505" y="380" width="165" height="70" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="587" y="402" text-anchor="middle" font-weight="600" fill="#2e7d32">GP · SiOxNy roughness</text>
  <text x="587" y="420" text-anchor="middle" font-size="11">XRR, nm (19 runs)</text>
  <rect x="695" y="380" width="170" height="70" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="780" y="402" text-anchor="middle" font-weight="600" fill="#2e7d32">GP · AlN density</text>
  <text x="780" y="420" text-anchor="middle" font-size="11">XRR, g/cm³ (50 runs)</text>
  <rect x="315" y="462" width="550" height="62" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="590" y="484" text-anchor="middle" font-weight="600" fill="#2e7d32">prediction maps + values at the suggested sample and at each alternative</text>
  <text x="590" y="504" text-anchor="middle" font-size="11" fill="#555">map_*_mean.png · map_*_slices.png · dashboard.png (main μ, σ, EI + aux means over the two most influential knobs)</text>
  <line x1="397" y1="450" x2="397" y2="460" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="587" y1="450" x2="587" y2="460" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="780" y1="450" x2="780" y2="460" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="590" y="552" text-anchor="middle" font-size="10" fill="#777">campaign.AuxModels · plotting.dashboard</text>

  <!-- data arrows -->
  <path d="M245,300 C270,300 270,225 313,225" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M245,400 C270,400 270,415 313,415" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM review -->
  <rect x="935" y="130" width="235" height="300" rx="10" fill="#fdf4f3" stroke="#b3261e" stroke-width="1.5"/>
  <text x="1052" y="154" text-anchor="middle" font-weight="600" fill="#b3261e">LLM review (Claude)</text>
  <text x="1052" y="176" text-anchor="middle" font-size="11">input packet:</text>
  <text x="1052" y="192" text-anchor="middle" font-size="11">suggestion + alternatives</text>
  <text x="1052" y="207" text-anchor="middle" font-size="11">FWHM ± σ, EI, aux predictions</text>
  <text x="1052" y="222" text-anchor="middle" font-size="11">lengthscales, best runs, all data</text>
  <text x="1052" y="237" text-anchor="middle" font-size="11">dashboard image</text>
  <line x1="955" y1="248" x2="1150" y2="248" stroke="#ccc"/>
  <text x="1052" y="266" text-anchor="middle" font-size="11">system prompt: plasma / sputter physics,</text>
  <text x="1052" y="281" text-anchor="middle" font-size="11">how to read GP + EI, decision rules</text>
  <line x1="955" y1="292" x2="1150" y2="292" stroke="#ccc"/>
  <text x="1052" y="312" text-anchor="middle" font-size="11" font-weight="600">output (JSON):</text>
  <text x="1052" y="330" text-anchor="middle" font-size="11">accept the GP sample → reason</text>
  <text x="1052" y="346" text-anchor="middle" font-size="11">or reject → other recipe + reason</text>
  <text x="1052" y="362" text-anchor="middle" font-size="11">+ risks, confidence</text>
  <text x="1052" y="392" text-anchor="middle" font-size="10" fill="#777">llm_review.py · packet.json</text>
  <text x="1052" y="408" text-anchor="middle" font-size="10" fill="#777">llm_prompt.md (manual fallback)</text>
  <line x1="865" y1="225" x2="933" y2="225" stroke="#b3261e" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <path d="M865,493 C905,493 905,330 933,330" fill="none" stroke="#b3261e" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- user + experiment -->
  <rect x="935" y="470" width="235" height="110" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="1052" y="494" text-anchor="middle" font-weight="600">You decide, then grow</text>
  <text x="1052" y="514" text-anchor="middle" font-size="11">GP sample or LLM alternative</text>
  <text x="1052" y="530" text-anchor="middle" font-size="11">plasma treat + sputter AlN (13 min)</text>
  <text x="1052" y="546" text-anchor="middle" font-size="11">XRD → FWHM, XRR → thick/rough/density</text>
  <text x="1052" y="566" text-anchor="middle" font-size="11" fill="#555">add a row to the log</text>
  <line x1="1052" y1="430" x2="1052" y2="468" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- feedback -->
  <path d="M1052,580 L1052,640 L137,640 L137,452" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="600" y="634" text-anchor="middle" font-size="12" fill="#333">closed loop: each new run goes into the spreadsheet; every GP is refit from scratch next time</text>

  <!-- commands -->
  <rect x="280" y="665" width="890" height="115" rx="10" fill="#fafafa" stroke="#bbb"/>
  <text x="300" y="688" font-weight="600" font-size="12">One iteration</text>
  <text x="300" y="708" font-size="11.5" font-family="Consolas, monospace">python scripts/run_pipeline.py "AlN Sputter Log.xlsx"                      # Windows, scikit-learn backend</text>
  <text x="300" y="726" font-size="11.5" font-family="Consolas, monospace">python scripts/run_pipeline.py "AlN Sputter Log.xlsx" --llm                # + Claude review (needs ANTHROPIC_API_KEY)</text>
  <text x="300" y="744" font-size="11.5" font-family="Consolas, monospace">wsl -e bash -lc '... ~/venvs/aln_bo/bin/python scripts/run_pipeline.py ... --backend botorch'   # BoTorch in WSL</text>
  <text x="300" y="766" font-size="11" fill="#555">outputs: results/&lt;timestamp&gt;/ suggestion.csv, alternatives.csv, map_*.png, dashboard.png, packet.json, llm_prompt.md, llm_review.md, summary.txt</text>
</svg>
